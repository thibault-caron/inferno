name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-agent-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=test_password
          POSTGRES_USER=test_user
          POSTGRES_DB=test_db
          DB_PORT=5432
          SERVER_PORT=8888
          TLS=false
          COMPOSE_PROFILES=agent
          EOF

      - name: Build agent transport library
        run: |
          docker compose --profile agent run transport
          if [ $? -ne 0 ]; then
            echo "Transport build failed!"
            exit 1
          fi

      - name: Build agent binary
        run: |
          docker compose --profile agent run agent-builder
          if [ $? -ne 0 ]; then
            echo "Agent build failed!"
            docker compose logs agent-builder
            exit 1
          fi

      - name: List all Docker volumes
        run: |
          docker volume ls

      - name: Check volume contents
        run: |
          docker run --rm -v inferno_agent-build:/app alpine:latest ls -lhR /app

      - name: Extract agent binary
        run: |
          docker run --rm \
            -v inferno_agent-build:/app \
            -v ${{ github.workspace }}:/out \
            alpine:latest \
            cp /app/agent/build/bin/agent /out/agent

      - name: Verify binary
        run: |
          ls -lh agent
          file agent
          ldd agent || true

      - name: Install linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create AppImage
        run: |
          mkdir -p appdir/usr/bin
          cp agent appdir/usr/bin/
          
          ./linuxdeploy-x86_64.AppImage \
            --appdir=appdir \
            --output=appimage

      - name: Rename and upload
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv Inferno-*.AppImage inferno-agent-linux-${VERSION}.AppImage
          ls -lh inferno-agent-linux-*.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-appimage
          path: inferno-agent-linux-*.AppImage