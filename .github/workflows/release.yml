name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-agent-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=test_password
          POSTGRES_USER=test_user
          POSTGRES_DB=test_db
          DB_PORT=5432
          SERVER_PORT=8888
          TLS=false
          COMPOSE_PROFILES=agent
          EOF

      - name: Build agent in Docker
        run: |
          docker compose --profile agent build agent-builder
          docker compose --profile agent run agent-builder

      - name: Extract agent binary from volume
        run: |
          docker run --rm \
            -v inferno-agent-build:/app \
            -v ${{ github.workspace }}:/out \
            alpine:latest \
            sh -c "cp /app/agent/build/bin/agent /out/agent"

      - name: Verify binary exists
        run: |
          ls -lh agent
          file agent

      - name: Install linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ls -lh linuxdeploy-x86_64.AppImage

      - name: Create AppImage
        run: |
          mkdir -p appdir/usr/bin
          cp agent appdir/usr/bin/
          
          ./linuxdeploy-x86_64.AppImage \
            --appdir=appdir \
            --output=appimage

      - name: Rename AppImage with version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ls -lh *.AppImage
          mv Inferno-*.AppImage inferno-agent-linux-${VERSION}.AppImage
          ls -lh inferno-agent-linux-*.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux-appimage
          path: inferno-agent-linux-*.AppImage